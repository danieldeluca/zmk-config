# Keyboard name shown to USB and Bluetooth hosts (max. 16 characters).
CONFIG_ZMK_KEYBOARD_NAME="Sofle Choc BT"

# Optional pointing-device support. Smooth scrolling requires pointing support.
# CONFIG_ZMK_POINTING=y
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Optional compatibility with BIOS/UEFI and pre-boot environments.
# CONFIG_ZMK_USB_BOOT=y

# Enter idle after five minutes and deep sleep after one hour of inactivity.
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Keep the display active when the keyboard enters idle.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Use underglow by default and turn it off when the keyboard enters idle.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Change underglow brightness in steps of five percentage points.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=5

# Default underglow brightness, hue, and saturation after settings are reset.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=200
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=98

# Switch to the Windows Belgian layout layer (WIN, layer 1) while Bluetooth
# profile 2 (index 1) is selected; every other profile uses the macOS French layout.
CONFIG_ZMK_PROFILE_LAYER=y
CONFIG_ZMK_PROFILE_LAYER_PROFILE=1
CONFIG_ZMK_PROFILE_LAYER_LAYER=1
